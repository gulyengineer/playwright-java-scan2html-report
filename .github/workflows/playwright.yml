name: Playwright Tests
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Playwright Browsers
        run: mvn exec:java -e -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install --with-deps"

      - name: Run Playwright Tests
        run: xvfb-run mvn test -Dheadless=true
        env:
          # Point this to your live GitHub Pages URL
          TEST_REPORT_URL: https://gulyengineer.github.io/playwright-java-scan2html-report/

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # always run even if the tests fail
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            report_paths: '**/target/surefire-reports/TEST-*.xml'
            fail_on_empty: false
            include_passed: true

