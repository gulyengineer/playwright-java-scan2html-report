name: Playwright Tests
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Playwright Browsers
        run: mvn exec:java -e -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install --with-deps"

      - name: Run Playwright Tests
        run: mvn test
        env:
          # Point this to your live GitHub Pages URL
          TEST_REPORT_URL: https://gulyengineer.github.io/playwright-java-scan2html-report/
